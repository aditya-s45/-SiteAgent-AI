<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiteAgent AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>🤖 SiteAgent AI</h1>
    <p>Your Autonomous Browser Agent</p>
  </div>
  
  <div class="container">
    <div class="input-group">
      <textarea id="taskInput" placeholder="e.g. Find the cheapest flight to Delhi..."></textarea>
      <button id="btnStart">Run Agent</button>
    </div>
    
    <div class="status-panel">
      <div id="statusText">Agent is idle.</div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
